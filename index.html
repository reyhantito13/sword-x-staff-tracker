<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sword x Staff Progression</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <div class="top">
        <h1>Sword x Staff Progression</h1>
        <span class="mu" id="clock"></span
        ><span class="lg" role="group" aria-label="Language"
          ><button data-lang="en" class="on">EN</button><button data-lang="id">ID</button></span
        ><button
          type="button"
          class="hbtn"
          id="introBtn"
          data-intro="open"
          aria-label="Panduan penggunaan"
          title="Panduan penggunaan"
        >
          ?
        </button>
      </div>
      <div class="mu" id="lsnote" style="font-size: 12px; margin: 2px 0 8px"></div>
      <div class="mu" id="dbst" style="font-size: 12px; margin: -2px 0 8px"></div>
      <div class="tabs" id="tabs"></div>
      <div class="accs" id="accs"></div>
      <div id="view"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/intro.js"></script>
  </body>
</html>
